name: Go

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.4'

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        OUTPUT_NAME=titan-certbot
        if [ "$GOOS" == "windows" ]; then
          OUTPUT_NAME+=".exe"
        fi
        go build -v -o $OUTPUT_NAME ./...

    - name: Test
      if: matrix.goos == 'linux' # Run tests only on Linux for now
      run: go test -v ./...

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: titan-certbot-${{ matrix.goos }}-${{ matrix.goarch }}
        path: titan-certbot*
