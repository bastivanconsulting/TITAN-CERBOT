name: Reusable Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.4'

    - name: Build
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        OUTPUT_NAME=titan-certbot
        if [ "$GOOS" == "windows" ]; then
          OUTPUT_NAME+=".exe"
        fi
        go build -v -o $OUTPUT_NAME ./...

    - name: Test
      if: matrix.goos == 'linux'
      run: go test -v ./...

    - name: Install nfpm
      if: matrix.goos == 'linux'
      run: |
        echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
        sudo apt-get update
        sudo apt-get install nfpm

    - name: Determine Version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
        else
          echo "VERSION=0.0.${{ github.run_number }}" >> $GITHUB_ENV
        fi

    - name: Package (Linux)
      if: matrix.goos == 'linux'
      run: |
        nfpm package --packager deb --target titan-certbot_${VERSION}_amd64.deb
        nfpm package --packager rpm --target titan-certbot-${VERSION}-1.x86_64.rpm

    - name: Package (Windows)
      if: matrix.goos == 'windows'
      run: |
        zip titan-certbot-windows-amd64.zip titan-certbot.exe config.example.json README.md

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: titan-certbot-packages-${{ matrix.goos }}-${{ matrix.goarch }}
        path: |
          *.deb
          *.rpm
          *.zip
          titan-certbot
          titan-certbot.exe
